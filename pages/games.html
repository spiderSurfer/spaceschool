<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Solar School</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="icon" href="/assets/logo.png">
</head>
<body>
    <header>
        <div class="topbar"></div>
    </header>

    <main class="container">
        <section class="content-block" style="grid-column: 1 / -1;">
            <h2>Space Academy Games</h2>
            <p>Test your skills in our interactive simulations. Pilot rockets, explore planets, and master the cosmos.</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button onclick="window.setGameMode('rocket')" class="btn-primary">🚀 Rocket Pilot</button>
                <button onclick="window.setGameMode('catcher')" class="btn-primary" style="background: var(--accent-2);">⭐ Star Catcher</button>
            </div>

            <div style="background: var(--bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass); margin-top: 20px;">
                <canvas id="space-canvas" style="width: 100%; height: 400px; display: block;"></canvas>
            </div>
        </section>

        <div id="dashboard-grid" style="grid-column: 1 / -1;"></div>
    </main>
    <footer><p>&copy; Solar School 2026</p></footer>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
