<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar School | Astronomy Test</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="icon" href="assets/logo.png" />
    <!-- <meta name="description" content="Add a short summary here" /> -->
  </head>
  <body>
    <header>
      <div class="site-brand">
        <a href="/index.html"><img src="/assets/logo.png" width="20" height="20" alt="Solar School logo" class="logo" /></a>
        <h1>Solar School astronomy test</h1>
      </div>      
      <div id="topbar"></div>    
    </header>

    <main class="container">
        <!-- Example: /pages/Courses/test/astronomy.html -->
        <section class="content-block">
            <h1>Astronomy Quiz</h1>
            
            <div id="quiz-timer" style="font-family: monospace; font-size: 1.5rem; color: var(--accent); margin-bottom: 1rem; text-align: right;">Mission Time: 60s</div>

            <form id="quiz-form" data-module-id="astronomy_test" data-time-limit="60" data-next-lesson="/pages/Courses/test/planets.html">
                <!-- Question 1 -->
                <div class="quiz-question" data-answer="A" data-explanation="Mercury is only 36 million miles from the Sun, making it the closest planet in our system.">
                    <p>1. What is the closest planet to the Sun?</p>
                    <label><input type="radio" name="q1" value="A"> Mercury</label>
                    <label><input type="radio" name="q1" value="B"> Venus</label>
                    <label><input type="radio" name="q1" value="C"> Mars</label>
                </div>
        
                <!-- Question 2 -->
                <div class="quiz-question" data-answer="C" data-explanation="We reside in the Milky Way, a barred spiral galaxy containing hundreds of billions of stars.">
                    <p>2. Which galaxy do we live in?</p>
                    <label><input type="radio" name="q2" value="A"> Andromeda</label>
                    <label><input type="radio" name="q2" value="B"> Sombrero</label>
                    <label><input type="radio" name="q2" value="C"> Milky Way</label>
                </div>
        
                <div class="quiz-question" data-answer="B" data-explanation="Earth is the third planet from the Sun and the only one known to support life.">
                    <p>2. Which planet do we live in?</p>
                    <label><input type="radio" name="q3" value="A"> Sun</label>
                    <label><input type="radio" name="q3" value="B"> Earth</label>
                    <label><input type="radio" name="q3" value="C"> Mars</label>
                </div>
                <div class="quiz-question" data-answer="A" data-explanation="The Sun is a yellow dwarf star at the center of our Solar System.">
                    <p>What is the Sun ☀️?</p>
                    <label><input type="radio" name="q4" value="A"> Star</label>
                    <label><input type="radio" name="q4" value="B"> Planet</label>
                    <label><input type="radio" name="q4" value="C"> Astroid</label>
                </div>
        
                <!-- Submit Button -->
                <button type="submit" class="btn-primary">Submit Mission Report</button>
            </form>
        
            <!-- Results Section (Hidden by default) -->
            <div id="quiz-results" style="display: none; text-align: center; margin-top: 2rem; padding: 2rem; background: var(--glass); border-radius: var(--radius);">
                <h2>Mission Complete!</h2>
                <div id="animated-score" style="font-size: 4rem; font-weight: bold; color: var(--accent); margin: 1rem 0;">0%</div>
                <p id="result-feedback"></p>
                
                <div style="margin-top: 1.5rem; display: flex; gap: 10px; justify-content: center;">
                    <a id="next-lesson-btn" href="#" class="btn-primary" style="display: none; text-decoration: none;">Next Mission 🚀</a>
                    <button id="review-quiz-btn" class="btn-ghost">Review Mission</button>
                    <button onclick="location.reload()" class="btn-ghost">Retake Quiz</button>
                    <a id="share-quiz-btn" href="#" target="_blank" class="btn-primary" style="text-decoration: none;">Share Challenge 🚀</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
      <p>&copy; Solar School</p>
    </footer>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
