<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar School | Blackholes test</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="icon" href="assets/logo.png" />
    <!-- <meta name="description" content="Add a short summary here" /> -->
  </head>
  <body>
    <header>
      <div class="site-brand">
        <a href="/index.html"><img src="/assets/logo.png" width="20" height="20" alt="Solar School logo" class="logo" /></a>
        <h1>Solar School blackholes test</h1>
      </div>      
      <div id="topbar"></div>    
    </header>

    <main class="container">
        <!-- Example: /pages/Courses/test/astronomy.html -->
        <section class="content-block">
            <h1>Blackholes Quiz</h1>
            
            <div id="quiz-timer" style="font-family: monospace; font-size: 1.5rem; color: var(--accent); margin-bottom: 1rem; text-align: right;">Mission Time: 45s</div>

            <form id="quiz-form" data-module-id="Blackhole_test" data-time-limit="45" data-next-lesson="/pages/Courses/test/stars.html">
                <!-- Question 1 -->
                <div class="quiz-question" data-answer="A" data-explanation="Stellar black holes form when a massive star exhausts its fuel and collapses under its own gravity.">
                    <p>How does a blackhole form?</p>
                    <label><input type="radio" name="q1" value="A"> Star Death</label>
                    <label><input type="radio" name="q1" value="B"> Planet Collapse</label>
                    <label><input type="radio" name="q1" value="C"> Particle Acceleration</label>
                </div>
        
                <!-- Question 2 -->
                <div class="quiz-question" data-answer="C" data-explanation="Our galaxy revolves around a supermassive black hole called Sagittarius A*.">
                    <p>What is at the center of the Milky Way galaxy?</p>
                    <label><input type="radio" name="q2" value="A"> A death star</label>
                    <label><input type="radio" name="q2" value="B"> Orb OF Life</label>
                    <label><input type="radio" name="q2" value="C"> A Blackhole</label>
                </div>
        
                <div class="quiz-question" data-answer="B" data-explanation="Sagittarius A* was first imaged in 2022, confirming its existence at our galactic center.">
                    <p>What IS the central blackhole in the Milky Way Galaxy?</p>
                    <label><input type="radio" name="q3" value="A"> Sagittarius B</label>
                    <label><input type="radio" name="q3" value="B"> Sagittarius A</label>
                    <label><input type="radio" name="q3" value="C"> Sagittarius C</label>
                </div>
                <div class="quiz-question" data-answer="A" data-explanation="The Sun is our local star; it will likely end as a white dwarf, not a black hole.">
                    <p>What is the Sun ☀️?</p>
                    <label><input type="radio" name="q4" value="A"> Star</label>
                    <label><input type="radio" name="q4" value="B"> Planet</label>
                    <label><input type="radio" name="q4" value="C"> Astroid</label>
                </div>
        
                <!-- Submit Button -->
                <button type="submit" class="btn-primary">Submit Mission Report</button>
            </form>
        
            <!-- Results Section (Hidden by default) -->
            <div id="quiz-results" style="display: none; text-align: center; margin-top: 2rem; padding: 2rem; background: var(--glass); border-radius: var(--radius);">
                <h2>Mission Complete!</h2>
                <div id="animated-score" style="font-size: 4rem; font-weight: bold; color: var(--accent); margin: 1rem 0;">0%</div>
                <p id="result-feedback"></p>
                
                <div style="margin-top: 1.5rem; display: flex; gap: 10px; justify-content: center;">
                    <a id="next-lesson-btn" href="#" class="btn-primary" style="display: none; text-decoration: none;">Next Mission 🚀</a>
                    <button id="review-quiz-btn" class="btn-ghost">Review Mission</button>
                    <button onclick="location.reload()" class="btn-ghost">Retake Quiz</button>
                    <a id="share-quiz-btn" href="#" target="_blank" class="btn-primary" style="text-decoration: none;">Share Challenge 🚀</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
      <p>&copy; Solar School</p>
    </footer>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
