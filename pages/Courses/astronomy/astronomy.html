<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar School — [Page Title]</title>
    <script>
      (function() {
        const path = location.pathname.replace(/\/$/, '');
        const parts = path.split('/').filter(Boolean);
        const isFile = parts.length && /\.[^/]+$/.test(parts[parts.length - 1]);
        const depth = isFile ? parts.length - 1 : parts.length;
        const base = depth === 0 ? './' : '../'.repeat(depth);
        const baseEl = document.createElement('base');
        baseEl.href = base;
        document.head.prepend(baseEl);
      })();
    </script>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="icon" href="assets/logo.png" />
    <!-- <meta name="description" content="Add a short summary here" /> -->

      </div>      
      <div id="topbar"></div>    
    </header>

    <main class="container">
      <article class="page-template">

</html>
