<!DOCTYPE html>

        <meta name="theme-color" content="#071026" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <title>Space School</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <link rel="icon" href="/assets/logo.png" />
        <link rel="manifest" href="/manifest.json" />
    </head>
    <body>
        <header>
            <div class="topbar"></div>
        </header>

        <main class="container">
            <section id="intro">
                <p>We Are Space School With a Mission to Inspire and Educate</p>
                <p>We Provide Interactive Learning Experiences About Space</p>
                <p></p>
                <p>Discover the Wonders of Space with Us</p>
                
                <div id="user-dashboard" style="display: none; margin-top: 30px;">

                    <div id="dashboard-grid"></div>
                </div>

        <footer><p>&copy; Space School 2026</p><p><a href="pages/privacypolicy.html">Privacy Policy</a></p></footer>
        <script type="module" src="/scripts/main.js"></script>
        
        <!-- PWA Service Worker Registration -->
        <script>
            /**
             * Register service worker for offline support and PWA capabilities.
             * Silently fails if browser doesn't support service workers.
             */
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('[App] Service Worker registered:', registration);

                        // If there's a waiting worker, ask it to skip waiting (useful during development)
                        if (registration.waiting) {
                            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }

                        // Listen for new worker installation and request immediate activation
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                });
                            }
                        });

                        // Check for updates periodically
                        setInterval(() => {
                            registration.update().catch((error) => {
                                console.error('[App] Service Worker update check failed:', error);
                            });
                        }, 60000); // Check every minute
                    })
                    .catch((error) => {
                        console.warn('[App] Service Worker registration failed:', error);
                        // App will still work without service worker
                    });

                // Handle service worker updates; reload the page when controller changes
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    refreshing = true;
                    console.log('[App] Service Worker controller changed - reloading page for update');
                    window.location.reload();
                });
            }
        </script>
    </body>
</html>
